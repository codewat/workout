<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Centered Dumbbell & Lightning Icon -->
  <g transform="translate(256, 256) scale(1.1) translate(-256, -256)" filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <rect x="180" y="244" width="152" height="24" rx="12" fill="#e2e8f0"/>
    
    <!-- Left Weight Plates -->
    <rect x="148" y="200" width="32" height="112" rx="14" fill="url(#emerald)"/>
    <rect x="120" y="218" width="28" height="76" rx="12" fill="#047857"/>
    <rect x="96" y="234" width="24" height="44" rx="10" fill="#065f46"/>

    <!-- Right Weight Plates -->
    <rect x="332" y="200" width="32" height="112" rx="14" fill="url(#emerald)"/>
    <rect x="364" y="218" width="28" height="76" rx="12" fill="#047857"/>
    <rect x="392" y="234" width="24" height="44" rx="10" fill="#065f46"/>

    <!-- Lightning Bolt Overlay -->
    <path d="M268 136 L216 268 L256 268 L244 376 L304 244 L264 244 Z" fill="#34d399" stroke="#020617" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
